apiVersion: apps/v1
kind: Deployment
metadata:
  name: code_pulse
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: code_pulse
  template:
    metadata:
      labels:
        app: code_pulse
    spec:
      containers:
        - name: code-pulse
          image: billyboy864/code_pulse:latest  
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: PORT
              value: "8080"
---
